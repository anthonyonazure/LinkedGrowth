name: gauntlet
on:
  push:
  pull_request:
  # A repo you have not touched in three months has not been checked in three
  # months, while new vulnerabilities against what it already ships are
  # published daily. The dependency and secret gates are time-sensitive, not
  # edit-sensitive, so the whole gauntlet re-runs on a clock as well as on a
  # commit. Silence is not the same as safety.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
concurrency:
  # A literal, not ${{ github.workflow }}. That expression is the workflow's
  # display NAME, so any two workflow files that happen to share a name share a
  # concurrency group and cancel each other — and a cancelled run is neither a
  # pass nor a failure, so the dashboard recorded it as CANCELLED and the gates
  # simply never reported. Naming the group after this file makes the collision
  # structurally impossible instead of merely unlikely.
  group: gauntlet-gates-${{ github.ref }}
  cancel-in-progress: true
# Read-only by default, and every job that needs more says so itself. The
# default token is otherwise write-capable across the repository, so a scanner
# that pulls a compromised package is a scanner that can push to main. Only
# codeql widens this, and only to publish its own findings.
permissions:
  contents: read
jobs:
  node:
    name: Node / TypeScript (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }
      - run: npm ci
      - name: typecheck
        run: |
          script=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.typecheck ?? ''" 2>/dev/null || echo "")
          if [ -z "$script" ] || printf '%s' "$script" | grep -Eq '^[[:space:]]*(true|:|exit[[:space:]]+[0-9]+)[[:space:]]*$|^[[:space:]]*echo[^&|;]*([[:space:]]*(&&|;)[[:space:]]*(echo[^&|;]*|true|:|exit[[:space:]]+[0-9]+))*[[:space:]]*$'; then
            echo "GATE typecheck = NOT_APPLICABLE (package.json defines no real 'typecheck' script)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE typecheck NOT_APPLICABLE::package.json defines no real 'typecheck' script — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          bun run typecheck
          echo "GATE typecheck = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
      - name: lint
        run: |
          script=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.lint ?? ''" 2>/dev/null || echo "")
          if [ -z "$script" ] || printf '%s' "$script" | grep -Eq '^[[:space:]]*(true|:|exit[[:space:]]+[0-9]+)[[:space:]]*$|^[[:space:]]*echo[^&|;]*([[:space:]]*(&&|;)[[:space:]]*(echo[^&|;]*|true|:|exit[[:space:]]+[0-9]+))*[[:space:]]*$'; then
            echo "GATE lint = NOT_APPLICABLE (package.json defines no real 'lint' script)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE lint NOT_APPLICABLE::package.json defines no real 'lint' script — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          bun run lint
          echo "GATE lint = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
      - name: tests
        run: |
          script=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts?.test ?? ''" 2>/dev/null || echo "")
          if [ -z "$script" ] || printf '%s' "$script" | grep -Eq '^[[:space:]]*(true|:|exit[[:space:]]+[0-9]+)[[:space:]]*$|^[[:space:]]*echo[^&|;]*([[:space:]]*(&&|;)[[:space:]]*(echo[^&|;]*|true|:|exit[[:space:]]+[0-9]+))*[[:space:]]*$'; then
            echo "GATE tests = NOT_APPLICABLE (package.json defines no real 'test' script)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE tests NOT_APPLICABLE::package.json defines no real 'test' script — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          # The repo's OWN test command, not an assumption about it. Running
          # `bun test` in a vitest repo finds nothing and reports "no tests".
          # Shared with the stryker config this installer writes (testCommand),
          # because the two answers differing is exactly what broke mutation
          # testing on every vitest repo in the fleet.
          if printf '%s' "$script" | grep -Eq '^[[:space:]]*bun[[:space:]]+test([[:space:]]|$)'; then
            runner="$script --coverage"
          else
            runner="bun run test"
          fi
          echo "running: $runner"
          set +e
          out=$(eval "$runner" 2>&1); code=$?
          set -e
          echo "$out"
          if printf '%s' "$out" | grep -Eq '0 test files matching|[Nn]o tests? found'; then
            echo "GATE tests = NOT_APPLICABLE (the test runner found no tests in this repo)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE tests NOT_APPLICABLE::the test runner found no tests in this repo — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          # An `[ ... ] && exit` one-liner here is a trap: under `set -e` the list
          # evaluates false on the success path and can abort the step precisely
          # when the tests passed. Explicit `if` has no such ambiguity.
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "GATE tests = VERIFIED (ran: $script)" >> "$GITHUB_STEP_SUMMARY"
          # Coverage: the floor is a project total, and it is compared here
          # rather than by bun, whose scalar coverageThreshold is applied per
          # file — one weak module failing a run whose output reads "N pass,
          # 0 fail" is a coverage failure wearing the costume of a broken suite.
          floor=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).gauntlet?.coverageFloorPercent ?? ''" 2>/dev/null || echo "")
          total=$(printf '%s' "$out" | awk -F'|' '/^ *All files/ { f=$2+0; l=$3+0; print (f<l?f:l) }')
          if [ -z "$floor" ]; then
            echo "GATE coverage = NOT_APPLICABLE (no gauntlet.coverageFloorPercent in package.json)" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$total" ]; then
            echo "GATE coverage = NOT_APPLICABLE (this test command printed no coverage table)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE coverage NOT_APPLICABLE::this test command printed no coverage table — nothing was checked, so this tick verifies nothing"
          elif awk -v a="$total" -v b="$floor" 'BEGIN { exit !(a < b) }'; then
            echo "GATE coverage = FAILED (project total $total% is below the floor $floor%)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "GATE coverage = VERIFIED (project total $total% >= floor $floor%)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: dependency audit
        run: npm audit --audit-level=high
  docker:
    name: Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - name: hadolint
        run: |
          # find -print0 into a read loop, not $(find). A Dockerfile in a
          # directory with a space in its name would otherwise be split into
          # two paths, neither of which exists, and the loop would lint
          # nothing while exiting 0.
          find . -iname 'Dockerfile*' -not -path "./node_modules/*" -print0 |
            while IFS= read -r -d '' f; do
              echo "== $f"
              docker run --rm -i hadolint/hadolint hadolint --no-fail - < "$f" | tee -a "$GITHUB_STEP_SUMMARY"
              docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$f" || exit 1
            done
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      # gitleaks CLI is license-free; the gitleaks-action wrapper is NOT (it requires
      # a paid GITLEAKS_LICENSE on org accounts). Run the binary directly to avoid that.
      - name: secret scan
        run: |
          # actions/checkout announces "Temporarily overriding HOME=..." before
          # it registers its own safe.directory exception, i.e. it writes it to
          # a throwaway global config and takes it away again. The image's
          # /root/.gitconfig is bypassed too, because job containers run with
          # HOME=/github/home. Without this line git cannot open the repo and
          # gitleaks reports a clean scan of nothing.
          git config --global --add safe.directory "$(pwd)"
          set +e
          out=$(gitleaks detect --source . --redact --exit-code 1 --no-banner 2>&1); code=$?
          set -e
          echo "$out"
          # --exit-code covers "leaks were found". Nothing in it covers "the
          # scan could not start", which gitleaks downgrades to a log line
          # before exiting 0.
          if printf '%s' "$out" | grep -Eq 'detected dubious ownership|\[git\] fatal:|stderr is not empty'; then
            echo "GATE secrets = FAILED (gitleaks could not read this repository, so nothing was scanned)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if printf '%s' "$out" | grep -Eq '(^|[^0-9])0 commits scanned|scanned ~0 bytes'; then
            echo "GATE secrets = FAILED (gitleaks read 0 commits / 0 bytes — an armed repo always has committed files)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "GATE secrets = FAILED (gitleaks found secrets in this repository)" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          scanned=$(printf '%s' "$out" | grep -Eo '[0-9]+ commits scanned' | tail -1)
          echo "GATE secrets = VERIFIED (no leaks in $scanned)" >> "$GITHUB_STEP_SUMMARY"
  deps:
    name: dependency CVEs (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: scan lockfiles for known vulnerabilities
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive ./
          code=$?
          set -e
          # 0 = clean. 1 = vulnerabilities found, and that must fail the build.
          # 128 = no package manifests in this repo, which is not a defect.
          if [ "$code" = "128" ]; then
            echo "GATE deps = NOT_APPLICABLE (no dependency manifests in this repo)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" = "0" ]; then
            echo "GATE deps = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
  confusion:
    name: dependency confusion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: 'stable' }
      - run: go install github.com/visma-prodsec/confused@latest
      - name: check every manifest for unpublished package names
        run: |
          SCOPES="${{ vars.GAUNTLET_PRIVATE_SCOPES }}"
          blocked=""; broken=""; total=0
          manifest_names() {
            python3 - "$1" <<'GAUNTLET_MANIFEST_PY'
          import re
          import sys

          path = sys.argv[1]

          try:
              import tomllib
          except ImportError as exc:  # pragma: no cover - only on python < 3.11
              sys.stderr.write("gauntlet: no tomllib (%s); cannot read %s\n" % (exc, path))
              raise SystemExit(3)

          NAME = re.compile(r"^([A-Za-z0-9][A-Za-z0-9._-]*)")
          DIRECT_REF = re.compile(r"^[A-Za-z0-9._-]+\s*@\s*\S+")


          def dist_name(req):
              """The distribution name out of a PEP 508 requirement string."""
              if not isinstance(req, str):
                  return None
              req = req.strip()
              if not req or req.startswith("#") or req.startswith("-"):
                  return None
              if "://" in req or req.startswith("git+") or DIRECT_REF.match(req):
                  return None
              m = NAME.match(req)
              return m.group(1) if m else None


          def from_pyproject(text):
              data = tomllib.loads(text)
              project = data.get("project") or {}
              lists = [project.get("dependencies") or []]
              lists.extend((project.get("optional-dependencies") or {}).values())
              lists.extend((data.get("dependency-groups") or {}).values())
              for group in lists:
                  for req in group or []:
                      name = dist_name(req)
                      if name:
                          yield name
              poetry = (data.get("tool") or {}).get("poetry") or {}
              tables = [poetry.get("dependencies") or {}]
              for group in (poetry.get("group") or {}).values():
                  tables.append(group.get("dependencies") or {})
              for table in tables:
                  for name, spec in table.items():
                      if name.lower() == "python":
                          continue
                      if isinstance(spec, dict) and any(k in spec for k in ("path", "git", "url")):
                          continue
                      yield name


          def from_requirements(text):
              for raw in re.sub(r"\\\n", "", text).splitlines():
                  line = raw.split(" #", 1)[0].split("\t#", 1)[0].strip()
                  name = dist_name(line)
                  if name:
                      yield name


          try:
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()
              reader = from_pyproject if path.endswith("pyproject.toml") else from_requirements
              names = sorted(set(reader(text)))
          except Exception as exc:
              sys.stderr.write("gauntlet: could not read %s: %s\n" % (path, exc))
              raise SystemExit(3)

          for name in names:
              print(name)
          GAUNTLET_MANIFEST_PY
          }
          PYPI_SIMPLE="${PYPI_SIMPLE:-https://pypi.org/simple}"
          pypi_check() {
            unclaimed=""; unresolved=""; checked=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              skip=0
              if [ -n "$SCOPES" ]; then
                set -f
                for pat in $(printf '%s' "$SCOPES" | tr ',' ' '); do
                  # shellcheck disable=SC2254 # $pat is a glob on purpose: GAUNTLET_PRIVATE_SCOPES
                  # holds patterns like "@vortex/*", and quoting it would match that string
                  # literally and skip nothing.
                  case "$name" in $pat) skip=1 ;; esac
                done
                set +f
              fi
              [ "$skip" -eq 0 ] || { echo "  skip $name (declared private via GAUNTLET_PRIVATE_SCOPES)"; continue; }
              norm=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -e 's/[-_.][-_.]*/-/g')
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 "$PYPI_SIMPLE/$norm/" || echo 000)
              checked=$((checked+1))
              echo "  $name -> $PYPI_SIMPLE/$norm/ : $code"
              case "$code" in
                200) ;;
                404) unclaimed="$unclaimed $name" ;;
                *) unresolved="$unresolved $name(HTTP $code)" ;;
              esac
            done
          }
          # npm, maven and rubygems: confused queries those registries through
          # their real APIs and still works. -v so this can count what it read,
          # because "all packages seem to be available" is what it prints over
          # an empty manifest too.
          scan_confused() {
            [ -f "$2" ] || return 0
            echo "== $2 ($1)"
            set +e
            if [ -n "$SCOPES" ]; then
              out=$(confused -v -l "$1" -s "$SCOPES" "$2" 2>&1); code=$?
            else
              out=$(confused -v -l "$1" "$2" 2>&1); code=$?
            fi
            set -e
            echo "$out"
            n=$(printf '%s' "$out" | grep -cE '^Checking: https?://' || true)
            total=$((total+n))
            if [ "$code" -ne 0 ]; then
              if printf '%s' "$out" | grep -Eq 'not available in public package repositories'; then
                blocked="$blocked $2"
              else
                broken="$broken $2(confused exit $code)"
              fi
            fi
          }
          # The Python half, done here rather than by confused. A manifest that
          # declares no names is not a manifest that was scanned, so it adds
          # nothing to the total and cannot buy a VERIFIED on its own.
          scan_python() {
            [ -f "$1" ] || return 0
            echo "== $1 (pip)"
            nf=$(mktemp)
            if ! manifest_names "$1" > "$nf"; then
              broken="$broken $1(unreadable)"
              return 0
            fi
            pypi_check < "$nf"
            total=$((total+checked))
            [ -z "$unclaimed" ] || blocked="$blocked $1:$unclaimed"
            [ -z "$unresolved" ] || broken="$broken $1:$unresolved"
          }
          scan_confused npm package.json
          scan_confused mvn pom.xml
          scan_confused rubygems Gemfile.lock
          for f in pyproject.toml requirements.txt requirements-dev.txt dev-requirements.txt requirements/dev.txt test-requirements.txt; do
            scan_python "$f"
          done
          # Order matters. "I could not look this up" is not "I looked and it
          # was fine", and it outranks a finding because a half-completed scan
          # cannot be trusted about the half it did complete.
          if [ -n "$broken" ]; then
            echo "GATE dependency-confusion = FAILED (a registry lookup did not happen:$broken — those names were NOT checked)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$blocked" ]; then
            echo "GATE dependency-confusion = FAILED (a dependency name is not published on the public registry:$blocked)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "GATE dependency-confusion = NOT_APPLICABLE (no manifest in this repo declares a package name)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE dependency-confusion NOT_APPLICABLE::no manifest in this repo declares a package name — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          echo "GATE dependency-confusion = VERIFIED ($total package names checked against their public registries)" >> "$GITHUB_STEP_SUMMARY"
  phi:
    name: PHI in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: scan log statements for patient identifiers
        run: |
          # Log call on the same line as an unambiguous identifier.
          HARD='(console\.(log|info|warn|error|debug)|logger?\.(log|info|warn|error|debug)|context\.log)[^;]{0,200}\b(ssn|social_security|date_of_birth|dateOfBirth|\bdob\b|medical_record|\bmrn\b|diagnosis_code|icd10)\b'
          # Whole objects stringified into a log — usually carries everything.
          SOFT='(console\.(log|info|warn|error)|logger?\.(log|info|warn|error)|context\.log)[^;]{0,120}JSON\.stringify\((patient|user|profile|subject)'
          hard=$(grep -rInE "$HARD" --include='*.ts' --include='*.tsx' --include='*.js' \
                 --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=__tests__ . || true)
          soft=$(grep -rInE "$SOFT" --include='*.ts' --include='*.tsx' --include='*.js' \
                 --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=__tests__ . || true)
          {
            echo "### PHI-in-logs scan"
            echo "<pre>"
            echo "blocking matches:"; echo "${hard:-  (none)}"
            echo ""; echo "review these (whole object logged):"; echo "${soft:-  (none)}"
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$hard" ]; then
            echo "GATE phi-in-logs = FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GATE phi-in-logs = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
  sbom:
    name: software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 365
  licenses:
    name: licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: inventory dependency licences
        run: |
          curl -sSfL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          set +e
          ./osv-scanner scan source --recursive --experimental-licenses-summary ./ > licences.txt 2>&1
          code=$?
          set -e
          if [ "$code" = "128" ]; then
            echo "GATE licences = NOT_APPLICABLE (no dependency manifests)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Dependency licences"
            echo "<pre>"
            cat licences.txt
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Deny-list, not allow-list: an allow-list would fail every brownfield
          # repo on day one and teach everyone to ignore the gate.
          if grep -Eq '(AGPL|GPL-2|GPL-3|SSPL|CC-BY-NC|BUSL)' licences.txt; then
            echo "GATE licences = FAILED (strong-copyleft or non-commercial licence present)" >> "$GITHUB_STEP_SUMMARY"
            grep -E '(AGPL|GPL-2|GPL-3|SSPL|CC-BY-NC|BUSL)' licences.txt
            exit 1
          fi
          echo "GATE licences = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
  sast:
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: advisory scan (all severities, never blocks)
        run: |
          git config --global --add safe.directory "$(pwd)"
          semgrep scan --config=p/default --metrics=off --no-error \
            --text --output=advisory.txt . || true
          {
            echo "### Semgrep advisory findings (not blocking)"
            echo "<pre>"
            tail -c 60000 advisory.txt || echo "(none)"
            echo "</pre>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: blocking scan (high-confidence only)
        run: |
          # Repeated deliberately: each step must stand on its own, so that
          # deleting the step above can never silently disarm this one.
          git config --global --add safe.directory "$(pwd)"
          set +e
          out=$(semgrep scan --config=p/default --metrics=off --severity=ERROR --error . 2>&1); code=$?
          set -e
          echo "$out"
          targets=$(printf '%s' "$out" | awk '/Ran [0-9]+ rules? on [0-9]+ files?:/ { n = $5 } END { if (n != "") print n }')
          if [ -z "$targets" ]; then
            echo "GATE sast = FAILED (semgrep printed no scan summary, so it cannot be said to have run)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$targets" -eq 0 ]; then
            echo "GATE sast = NOT_APPLICABLE (semgrep found no files it can analyse in this repo)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE sast NOT_APPLICABLE::semgrep found no files it can analyse in this repo — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "GATE sast = VERIFIED (no ERROR-severity findings across $targets files)" >> "$GITHUB_STEP_SUMMARY"
  mutation:
    name: mutation testing (stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: mutation testing
        run: |
          set +e
          out=$(bun run mutation 2>&1); code=$?
          set -e
          echo "$out"
          # Stryker with a glob that matches nothing prints "Final mutation
          # score of NaN is greater than or equal to break threshold 50" and
          # exits 0 — a mutation gate reporting a pass having mutated nothing.
          # The glob is derived from this repo's real layout when arming, so
          # this branch should now be unreachable; it stays because "should be
          # unreachable" is exactly what was believed before.
          if printf '%s' "$out" | grep -Eq 'No files found for mutation|Instrumented 0 source file|mutation score of NaN|Ran NaN tests per mutant'; then
            echo "GATE mutation = NOT_APPLICABLE (stryker generated no mutants, so the score was vacuous)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE mutation NOT_APPLICABLE::stryker generated no mutants, so the score was vacuous — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "GATE mutation = VERIFIED" >> "$GITHUB_STEP_SUMMARY"
  container:
    name: container posture (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # Released tags on this action carry a leading "v". @0.28.0 does not
      # exist, so every armed Docker repo failed this step on "unable to
      # resolve action" — a gate that never ran once.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: 'false'
      # trivy does not run in a job container — the action installs the binary
      # and runs it as the runner user — so it never had the ownership failure
      # that silenced the secret scan. It does have the blind spot behind that
      # failure: a scan that parsed no files prints an empty report table and
      # exits 0. The action offers no way to read its own output back, so the
      # same scan is repeated here non-blocking (trivy stays on PATH for the
      # rest of the job) purely to count what it detected.
      - name: prove the scan had something to read
        run: |
          out=$(trivy config . --exit-code 0 --skip-version-check 2>&1) || true
          echo "$out"
          configs=$(printf '%s' "$out" | awk -F'num=' '/Detected config files/ { n = $2 + 0; seen = 1 } END { if (seen) print n }')
          if [ -z "$configs" ]; then
            echo "GATE container = FAILED (trivy never reported what it detected, so this scan proves nothing)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$configs" -eq 0 ]; then
            # Zero has two meanings and they are not the same fact: either the
            # Dockerfile that armed this job is gone, or trivy could not read it.
            # No pipe into grep here on purpose: host jobs run under
            # `bash -e -o pipefail`, where grep -q exiting early SIGPIPEs find
            # and the whole condition reads false — the wrong branch, silently.
            if [ -n "$(find . -path ./.git -prune -o -iname 'Dockerfile*' -print -quit)" ]; then
              echo "GATE container = FAILED (this repo has a Dockerfile and trivy detected 0 config files)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "GATE container = NOT_APPLICABLE (no Dockerfile is left in this repo for trivy to inspect)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE container NOT_APPLICABLE::no Dockerfile is left in this repo for trivy to inspect — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          echo "GATE container = VERIFIED (trivy inspected $configs config file(s))" >> "$GITHUB_STEP_SUMMARY"
  pipeline:
    name: pipeline security (zizmor, actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: audit the workflows that run every other gate
        run: |
          shopt -s nullglob
          set -- .github/workflows/*.yml .github/workflows/*.yaml
          if [ "$#" -eq 0 ]; then
            echo "GATE pipeline = NOT_APPLICABLE (this repo has no workflow files to audit)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GATE pipeline NOT_APPLICABLE::this repo has no workflow files to audit — nothing was checked, so this tick verifies nothing"
            exit 0
          fi
          echo "auditing $# workflow file(s)" >> "$GITHUB_STEP_SUMMARY"

          curl -sSfL "https://github.com/rhysd/actionlint/releases/latest/download/actionlint_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz"             | tar xz -C /usr/local/bin actionlint
          pipx install zizmor >/dev/null

          set +e
          actionlint -color=never "$@" > actionlint.out 2>&1; lint=$?
          zizmor --no-progress --min-severity=medium "$@" > zizmor.out 2>&1; zz=$?
          set -e

          {
            echo "### pipeline security"
            echo '<pre>'
            cat actionlint.out
            cat zizmor.out
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

          # zizmor exits 14 for "findings at or above the threshold" and 0 for
          # none. Any other non-zero is the tool failing to run, which must not
          # read as a pass: a crashed scanner and a clean repo both print
          # nothing useful.
          if [ "$zz" -ne 0 ] && [ "$zz" -ne 14 ]; then
            echo "GATE pipeline = FAILED (zizmor could not complete, exit $zz — nothing was audited)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$zz" -eq 14 ] || [ "$lint" -ne 0 ]; then
            echo "GATE pipeline = FAILED (see the findings above)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GATE pipeline = VERIFIED ($# workflow file(s) audited, no findings at medium or above)" >> "$GITHUB_STEP_SUMMARY"
  supplychain:
    name: supply chain posture (scorecard) — ADVISORY
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: score this repository's own practices
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSfL "https://github.com/ossf/scorecard/releases/download/v5.2.1/scorecard_5.2.1_linux_amd64.tar.gz"             | tar xz -C /usr/local/bin scorecard
          set +e
          scorecard --repo="github.com/${{ github.repository }}" --format=default > scorecard.out 2>&1; code=$?
          set -e
          {
            echo "### supply chain posture (advisory, never blocks)"
            echo '<pre>'
            cat scorecard.out
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] || ! grep -q "Aggregate score" scorecard.out; then
            echo "TIER supplychain = NOT_ARMED (scorecard could not read this repository; it needs a public repo or a token with read access)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=scorecard NOT_ARMED::supply chain posture was not measured"
            exit 0
          fi
          echo "TIER supplychain = REPORTED ($(grep 'Aggregate score' scorecard.out))" >> "$GITHUB_STEP_SUMMARY"
  codeql:
    name: deep analysis (codeql)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the lower-precision rules. This gate exists
          # to find what pattern matching cannot, so trading some noise for
          # reach is the whole point of running it.
          queries: security-extended
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
      - id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
          # A private repo without Advanced Security cannot receive the upload.
          # Failing the gate there would mean a red tick that says nothing about
          # the code, so the upload is allowed to fail and the analysis is not.
          upload: failure-only
          output: codeql-results
      - name: report
        if: always()
        run: |
          sarif=$(find codeql-results -name '*.sarif' | head -1)
          if [ -z "$sarif" ]; then
            echo "GATE codeql = FAILED (no results file — the analysis did not complete)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          n=$(python3 -c "import json,sys; print(sum(len(r.get('results',[])) for r in json.load(open(sys.argv[1]))['runs']))" "$sarif")
          if [ "$n" -gt 0 ]; then
            echo "GATE codeql = FAILED (${{ matrix.language }}: $n finding(s), see the Security tab or the codeql-results artifact)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GATE codeql = VERIFIED (${{ matrix.language }}: no findings)" >> "$GITHUB_STEP_SUMMARY"
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          retention-days: 30
